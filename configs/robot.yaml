# Copy to robot.local.yaml (git-ignored) to override ports/indices on your own laptop.
# Dynamixel (Koch v1.1-style) arm via our LeRobot plugin (pip install -e plugins/lerobot_robot_pillbot).
# preset: koch = 2x XL430-W250 + 4x XL330-M288 | all_m288 = 6x XL330-M288 | custom (+ models: [...])
# Every key except `type` is passed to LeRobot as --robot.<key> / --teleop.<key>.
follower:
  type: pillbot_koch_follower
  port: /dev/tty.usbmodemXXXX   # from `lerobot-find-port` (U2D2 / Waveshare bus board)
  id: pillbot_follower
  preset: all_m288              # we have 5-10 XL330-M288 and no XL430s
  # Arm: github.com/danslovich/5DOF_Robot_Arm — XL330-M288s, 4:1 printed planetary on the shoulder,
  # NO wrist pitch. The ELBOW is a goBILDA servo on the hub (XL330 too weak there): see pwm_joints.
  # These are the Dynamixel joints only. Explicit IDs below were supplied by the user on 2026-11-08.
  joints: [shoulder_pan, shoulder_lift, wrist_roll, gripper]
  motor_ids: {shoulder_lift: 12, wrist_roll: 15, gripper: 10}
  # shoulder_pan retains default 1; physical ID not yet confirmed.
  gripper_goal_current: 1000    # mA (XL330 max 1750). Higher = stronger grip on the cap, more heat
  use_degrees: true             # arm joints in degrees (scripted code assumes this)
leader:
  type: pillbot_koch_leader
  port: /dev/tty.usbmodemYYYY
  id: pillbot_leader
  preset: m288                  # m077 = 6x XL330-M077 | m288 = 6x XL330-M288 (needs 6 more servos;
                                # skip the leader entirely if you don't have them — scripted mode needs none)
  use_degrees: true             # MUST match the follower

# Two FIXED cameras (both ~45 deg down) + an ESP32-CAM (or the USB endoscope) on the wrist.
# Run `lerobot-find-cameras opencv` to get indices + supported resolutions.
# Indices can change when the phone (dis)connects — re-check before each session.
# Delete the `wrist` entry if it isn't mounted (LeRobot records every camera listed).
cameras:
  # ONE-CAMERA SETUP: only the ESP32-CAM on the wrist. For finding bottles the arm first moves to
  # the taught `scan` pose (~25-35 cm above the start zone, camera looking straight down), so the
  # view is the same every time. LeRobot records every camera listed here.
  wrist:    # ESP32-CAM on the hand (firmware/esp32_cam). Needs the pillbot plugin installed.
    type: pillbot_ipcam
    url: http://pillbot-cam.local:81/stream   # or the IP printed at boot, e.g. http://10.20.70.37:81/stream
    width: 320                           # must match FRAME in the sketch (QVGA = 320x240, VGA = 640x480)
    height: 240
    fps: 15
  # Optional extra fixed cameras (uncomment if you add one):
  # phone:  {type: opencv, index_or_path: 1, width: 640, height: 480, fps: 30}
  # laptop: {type: opencv, index_or_path: 0, width: 640, height: 480, fps: 30}
  # wrist (USB endoscope instead): {type: opencv, index_or_path: 2, width: 640, height: 480, fps: 30}

# Camera used by scripted perception (bottle detection, zone mapping, marker tracking)
perception_camera: wrist
default_bottle: standard_amber_40dr   # used by --bottle auto when no width can be measured

perception:                # bottle detection (tune: detect_bottle --tune)
  method: background         # background (any bottle, fixed viewpoint) | yolo | color (amber)
  camera_on_arm: true        # perception camera rides on the arm -> look from the `scan` pose
  anchor: auto               # point that marks the bottle: center (top-down view) | base (angled view) | auto
  shape_filter: auto         # on for the wrist camera: reject hands, boxes, sticks — works at an angle too
  min_curve: 0.045           # box test: outline bend vs a 4-corner shape. Boxes 0-0.03, bottles 0.06+
  max_aspect: 3.5            # long/short side: rejects sticks, cables, the arm
  min_symmetry: 0.86         # same shape when turned 180°? bottles 0.87-1.0, tape dispenser/stapler/mug lower
  zone_only: true            # once the zone is calibrated, ignore everything outside the taped square
  zone_margin: 0.15          # ...plus 15% of its size around it
  min_solidity: 0.88         # rejects shapes with gaps (fingers)
  min_roundness: 0.0         # optional strict circle check (only for a perfectly top-down camera)
  reject_border: true        # ignore anything touching the image edge (a hand reaching in, the arm)
  diameter_mm: [25, 80]      # bottle/cap size range seen from above (checked once the zone is calibrated)
  scan_settle_s: 0.8         # wait after reaching `scan` (arm wobble + stream latency)
  align: true                # compensate small view shifts (backlash) before comparing to background
  min_area: 400              # px — ignore smaller blobs (QVGA ~400, VGA ~1500)
  diff_threshold: 30         # background: pixel change that counts as "object"
  hsv_low: [5, 80, 60]       # color method only
  hsv_high: [25, 255, 255]
  yolo_model: yolo11n.pt     # yolo method only (pip install -e ".[vision]")
  yolo_conf: 0.25
  zone_size_mm: 200          # side of the taped start-zone square (measure it!) -> bottle width in mm

# ESP32 "PillBot Hub" (firmware/esp32_hub): 2x ultrasonic, START/STOP/MODE buttons, 4 servos, relay
hub:
  enabled: true          # drives the clamp; set false to run arm-only (no clamp)
  port: auto                 # auto = find the ESP32 by its messages | /dev/serial/by-id/... (stable)
                             # | /dev/ttyUSB0 | socket://<uno-q-address>:5555 (firmware/unoq_hub)
                             # see: python -m pillbot.tools.ports
  baud: 115200

# SensX25 on a Waveshare FT232R USB-TTL adapter. Guide + Pi setup: docs/tactile.md
# Find/check it:  python -m pillbot.tools.tactile_live doctor     Tune it:  python -m pillbot.tools.tactile_live
tactile:
  backend: sensx         # sensx | sensx2 (one per jaw, set port2) | net (via tactile_server) | serial | mock | none
                         # (dry runs always use mock)
  port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG00ZVUK-if00-port0   # Pi (stable name for OUR adapter)
                         # Mac: /dev/cu.usbserial-BG00ZVUK — put it in robot.local.yaml
  port2: /dev/tty.usbserialSENSX2 # only for backend sensx2 (if you ever get a second sensor)
  url: localhost:8765    # only for backend net: where `python -m pillbot.sensors.tactile_server` listens
  baud: 921600
  shape: [5, 5]
  contact_threshold: 300 # sum of the 25 taxels (kPa each, 0..534) above tare that counts as contact — tune live
  slip_ratio: 0.3        # pressure falling below this fraction of grip pressure = slipping. 0.3: the hinged jaw's pressure shifts a lot between grip and push, 0.5 gave false alarms in the sim. Re-check with tactile_live on the real pad
  max_age_s: 0.25        # no new frame for this long = sensor lost: reads as "no data", logs an error

gripper:                 # LeRobot gripper units: 0 = closed, 100 = open
  open: 60
  closed: 0
  max_cap_mm: 50         # widest cap the jaws can open around — MEASURE on the real gripper
  step: 2.0              # close this much per tick while searching for contact
  squeeze: 4.0           # extra closing after contact for a firm grip
  target_pressure: null  # e.g. 500: after contact keep closing until the SensX pressure reaches this
                         # (null = just `squeeze`). Find a good value with tactile_live / the sim
  release_crack: 12      # setting the bottle down: open this much, back up, THEN open fully (no flinging)
  stall_margin: 6.0      # no tactile: if gripper stops this far above `closed`, we're holding something

# Opening: the clamp holds the bottle body; the ARM grips the cap, pushes down, and twists with wrist_roll.
open:
  twist_per_grip_deg: 90     # wrist_roll per grip; bigger = fewer regrips (limited by wrist cable slack)
  loosen_sign: -1            # -1 = decreasing wrist_roll unscrews the cap. Flip to 1 if it tightens instead
  max_slips: 3               # give up after this many slipped twists
  max_extra_twists: 2        # after twist_deg, lift; if the cap is still threaded, twist this many more times
  press: always              # push down to cap_press while twisting: always | child_proof (push_and_turn caps only) | never
place:                       # getting the bottle from the zone into the clip (control/pick_place.py)
  mode: slide                # slide = lift a few mm and slide it into the OPEN clamp (clip floor flush
                             # with the table) | lift = carry it up and over, lower it in
  skim: 0.06                 # slide height: this fraction of the way from grasp to hover (~3 mm)
retry:                       # scripted recovery instead of giving up (control/pick_place.py, open_sequence.py)
  seat: 1                    # bottle not seated after clamping: unclamp, regrip it in the clip, set it down, re-clamp
  open: 1                    # missed / slipping cap grip or cap still on: let go, back up, look again, retry
fixture:
  clamp_channel: 0           # hub servo ch0 = GPIO25 (goBILDA 2000)
  clamp_open_us: 1100        # tune: python -m pillbot.tools.fixture_bench tune clamp
  clamp_closed_us: 1700
  clamp_settle_s: 0.6
  clip_seated_mm: 60         # clip ultrasonic reads <= this when a bottle is seated (optional sensor)

trigger:
  default: enter             # enter | button | zone
  zone_present_mm: 120
  hold_s: 0.3

pwm_joints:                  # joints driven by a hobby servo on the ESP32 hub instead of a Dynamixel
  elbow_flex:                # goBILDA 2000 series (300° over 500-2500 us). Open loop: no position feedback
    channel: 1               # hub servo ch1 = GPIO26 (ch0 = clamp). Holds its angle on STOP (firmware)
    center_us: 1500          # pulse for 0° — MEASURE: fixture_bench servo 1 <us> until the forearm is at 0°
    us_per_deg: 6.67         # 2000 us / 300°. MEASURE: two known angles, (us2 - us1) / (deg2 - deg1)
    sign: 1                  # -1 if positive degrees bend the elbow the wrong way
    min_us: 600              # hard limits: keep the forearm off the base / its own stops
    max_us: 2400
idle:                        # while waiting / when the program ends (control/idle.py)
  pose: rest                 # park here (teach: python -m pillbot.control.teach --name rest); untaught = home
  limp: [shoulder_pan, wrist_roll, gripper]   # torque off: joints gravity doesn't pull on. `all` = every
                             # joint — ONLY if the rest pose is physically supported, or the arm drops
  servo_power_off: true      # also cut the hub relay (clamp servo rail) while idle
  max_current_ma: 150        # warn if any joint still holding draws more than this at rest
safety:
  max_joint_step_deg: 2.0      # per-tick target change in scripted mode (XL330s are light + fast)
  control_hz: 30
